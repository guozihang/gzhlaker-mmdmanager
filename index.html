<!DOCTYPE html>
<html>
<head>
    <title>MMDManager</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:;">
    <link rel="stylesheet" type="text/css" href="css/animate.css">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="css/element.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <style>
        #myModal { z-index: 9999 !important; }
        .modal-backdrop { z-index: 9998 !important; }
    </style>
</head>
<body data-spy="scroll" data-target="#bar" data-offset="1">
    <!-- 主体 -->
    <div id="app" class="el-container is-vertical">
        <header class="el-header">
        </header>
        <main class="el-main">
            <el-row :gutter="20">
                <el-col :span="20" :offset="2">
                    <transition id="aniset" mode="out-in" enter-active-class="animated fadeIn" leave-active-class="animated fadeOut">       
                        <router-view class="container-fluid">
                            
                        </router-view>
                    </transition>
                </el-col>
            </el-row>
        </main>
        <div class="modal fade" id="myModal">
            <div class="modal-dialog modal-lg">
              <div class="modal-content">
                <!-- 模态框头部 -->
                <div class="modal-header">
                  <h4 class="modal-title">预览</h4>
                  <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
           
                <!-- 模态框主体 -->
                <div class="modal-body" >
                    <div id="modelTarget">
    
                    </div>
                </div>
           
                <!-- 模态框底部 -->
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-dismiss="modal">关闭</button>
                </div>
           
              </div>
            </div>
        </div>
        <button id="modelButton" type="button" class="btn btn-primary" data-toggle="modal" data-target="#myModal" style="display: none;">打开模态框</button>
        <!-- Import progress overlay -->
        <div v-if="importProgress.visible" class="import-progress-card" style="position:fixed;top:12px;right:12px;z-index:9999;
            background:#fff;border-radius:10px;padding:18px;width:340px;
            box-shadow:0 4px 20px rgba(0,0,0,.12)">
            <div style="font-weight:bold;margin-bottom:10px;font-size:14px">导入进度</div>
            <el-progress :percentage="importProgress.pct" :stroke-width="8"
                :color="importProgress.pct===100 ? '#67c23a' : '#409eff'"></el-progress>
            <div style="margin-top:10px;font-size:13px;color:#303133">{{importProgress.text}}</div>
            <div style="margin-top:4px;font-size:12px;color:#909399">{{importProgress.detail}}</div>
            <div style="font-size:12px;color:#c0c4cc;margin-top:2px">{{importProgress.done}}/{{importProgress.total}}</div>
        </div>
    </div>
    
    <!--------------------------- Template ----------------------------->
    <!--######################### 初始化 #########################-->
    <template id='tInit'>
        <div class="el-container">
            <div class="el-main">初始化中</div>
        </div>
    </template>
    <!--######################### 开始 #########################-->
    <template id="tIndex">
        <div>
                    <div style="display:flex;align-items:stretch;gap:6px;margin-bottom:4px">
                        <div style="flex:1;position:relative">
                            <div style="display:flex;align-items:center;border:1px solid #dcdfe6;border-radius:4px;padding:0 8px;min-height:40px;flex-wrap:wrap;gap:4px;background:#fff">
                                <span v-for="(f, idx) in activeFilters" :key="idx" style="display:inline-flex;align-items:center;border-radius:3px;padding:2px 6px;font-size:12px;white-space:nowrap" :style="f.type==='tag'?'background:#ecf5ff;color:#409eff':f.type==='category'?'background:#fdf6ec;color:#e6a23c':f.type==='bookmark'?'background:#fef0f0;color:#f56c6c':'background:#f0f9eb;color:#67c23a'">
                                    <span style="font-weight:bold;margin-right:1px">{{f.type==='tag'?'#':f.type==='category'?'@':f.type==='bookmark'?'$':'!'}}</span>{{f.type==='bookmark'?'已收藏':f.type==='nsfw'?'NSFW+':f.type==='nsfwOnly'?'仅NSFW':f.value}}
                                    <i class="el-icon-close" @click="removeFilter(idx)" style="margin-left:3px;cursor:pointer;font-size:12px"></i>
                                </span>
                                <input v-model="searchText" placeholder="$收藏 @分类 #标签 名称..." @input="onSearchInput" @keydown="onSearchKeydown" style="flex:1;border:none;outline:none;min-width:120px;height:32px;font-size:14px;padding:0">
                                <span style="color:#909399;font-size:12px;white-space:nowrap">模型数：{{gridItems.length}}</span>
                            </div>
                            <div v-if="suggestionVisible && searchSuggestions.length > 0" style="position:absolute;top:100%;left:0;right:0;z-index:2000;background:#fff;border:1px solid #dcdfe6;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.15);max-height:240px;overflow-y:auto">
                                <div v-for="(s, si) in searchSuggestions" :key="s.label" @click="selectSuggestion(s)" :style="{padding:'8px 14px',cursor:'pointer',fontSize:'13px',borderBottom:'1px solid #f5f5f5',display:'flex',alignItems:'center',background: suggestionIndex===si?'#f0f7ff':'#fff'}"
                                    :style="{color: s.type==='tag'?'#409eff':'#e6a23c'}">
                                    <span style="font-weight:bold;margin-right:4px;font-size:14px">{{s.type==='tag'?'#':'@'}}</span>{{s.value}}
                                </div>
                            </div>
                        </div>
                        <el-button @click="settingsDialogVisible=true" style="height:40px" icon="el-icon-setting"></el-button>
                        <el-button @click="helpDialogVisible=true" style="height:40px" icon="el-icon-question"></el-button>
                        <el-button @click="settings.preview.viewMode = settings.preview.viewMode==='grid' ? 'table' : 'grid'" style="height:40px">
                            <i v-if="settings.preview.viewMode==='grid'" class="el-icon-menu"></i>
                            <i v-else class="el-icon-s-grid"></i>
                        </el-button>
                    </div>
                    <!-- 表格视图（一个模型一行，和瀑布流一致） -->
                    <el-table v-if="settings.preview.viewMode!=='grid'" :data="gridItems" stripe style="width:100%;min-height:200px" size="mini" :cell-style="{padding:'4px 6px'}">
                        <el-table-column label="#" width="50" align="center">
                            <div slot-scope="scope">
                                <el-popover placement="bottom" trigger="hover">
                                    <div style="display:flex;align-items:center;gap:4px">
                                        <span style="font-size:12px;word-break:break-all">{{scope.row.path}}</span>
                                        <el-button size="mini" circle @click="copy(scope.row.path)">复</el-button>
                                    </div>
                                    <el-button type="text" size="mini" @click="openParent(scope.row.path)" slot="reference">{{scope.$index+1}}</el-button>
                                </el-popover>
                            </div>
                        </el-table-column>
                        <el-table-column sortable prop="groupName" label="文件夹" min-width="140">
                            <div slot-scope="scope">
                                <span style="font-size:13px">{{scope.row.groupName}}</span>
                            </div>
                        </el-table-column>
                        <el-table-column sortable prop="modelName" label="模型名" min-width="160">
                            <div slot-scope="scope">
                                <div style="display:flex;align-items:center;gap:4px">
                                    <span style="font-size:13px;word-break:break-all">{{scope.row.modelName}}</span>
                                    <el-button type="text" size="mini" @click.stop="editTag(scope.row.path, scope.row.group)" style="padding:0;font-size:10px">编</el-button>
                                </div>
                            </div>
                        </el-table-column>
                        <el-table-column label="文件夹" min-width="120">
                            <div slot-scope="scope">
                                <span style="font-size:13px">{{scope.row.groupName}}</span>
                            </div>
                        </el-table-column>
                        <el-table-column sortable prop="modelName" label="模型名" min-width="140">
                            <div slot-scope="scope">
                                <div style="display:flex;align-items:center;gap:4px">
                                    <span style="font-size:13px;word-break:break-all">{{scope.row.modelName}}</span>
                                    <el-button type="text" size="mini" @click.stop="editTag(scope.row.path, scope.row.group)" style="padding:0;font-size:10px">编</el-button>
                                </div>
                            </div>
                        </el-table-column>
                        <el-table-column label="分类" width="140">
                            <div slot-scope="scope">
                                <span v-if="scope.row.category" style="font-size:11px;color:#e6a23c;cursor:pointer" @click="filterByCategory(scope.row.category)">{{_getCategoryPath(scope.row.category)}}</span>
                            </div>
                        </el-table-column>
                        <el-table-column label="标签" min-width="120">
                            <div slot-scope="scope">
                                <span v-for="t in scope.row.groupInfo.tags" :key="t" style="margin-right:3px">
                                    <el-tag size="mini"><el-button type="text" size="mini" @click="changeTag(t)">{{t}}</el-button></el-tag>
                                </span>
                            </div>
                        </el-table-column>
                        <el-table-column label="模型" :width="settings.preview.thumbnailWidth+20" align="center">
                            <div slot-scope="scope">
                                <el-popover placement="left" width="420" trigger="hover" :disabled="!hasPreview(scope.row.path)">
                                    <div v-if="hasPreview(scope.row.path)" style="text-align:center">
                                        <img :src="previewSrc(scope.row.path)" loading="lazy" style="max-width:400px;max-height:500px;display:block;margin:0 auto">
                                    </div>
                                    <div v-else style="text-align:center;color:#999;padding:20px">暂无预览</div>
                                    <img v-if="settings.preview.buttonMode==='thumbnail'&&hasPreview(scope.row.path)" slot="reference" :src="previewSrc(scope.row.path)" :data-filepath="scope.row.path" draggable="true" loading="lazy" @click="updateModel(scope.row.path)" @contextmenu.prevent="exportToMmd(scope.row.path)"
                                        :style="{borderRadius:'2px',cursor:'pointer',width:settings.preview.thumbnailWidth+'px',height:settings.preview.thumbnailHeight+'px',objectFit:'contain',display:'block',margin:'0 auto',padding:'0'}">
                                    <el-button v-else slot="reference" size="mini" circle :data-filepath="scope.row.path" draggable="true" @click="updateModel(scope.row.path)" @contextmenu.native.prevent="exportToMmd(scope.row.path)">模</el-button>
                                </el-popover>
                            </div>
                        </el-table-column>
                        <el-table-column width="50" align="center">
                            <div slot-scope="scope">
                                <el-button circle size="mini" @click="vip(scope.row.path)" :type="isBookmarked(scope.row.path)?'warning':'default'">{{isBookmarked(scope.row.path)?'★':'☆'}}</el-button>
                            </div>
                        </el-table-column>
                    </el-table>
                    <!-- 瀑布流视图 -->
                    <div v-if="settings.preview.viewMode==='grid'" style="display:flex;flex-wrap:wrap;gap:12px;padding:4px 0;min-height:200px;justify-content:center">
                        <div v-for="(item, idx) in gridItems" :key="item.path" style="display:flex;flex-direction:column;align-items:center"
                            @contextmenu.prevent="exportToMmd(item.path)">
                            <div style="display:flex;justify-content:space-between;width:100%;margin-bottom:2px;font-size:11px;color:#909399">
                                <el-popover placement="bottom" trigger="hover">
                                    <div style="display:flex;align-items:center;gap:4px">
                                        <span style="font-size:11px;word-break:break-all">{{item.path}}</span>
                                        <el-button size="mini" circle @click="copy(item.path)">复</el-button>
                                    </div>
                                    <el-button type="text" size="mini" @click="openParent(item.path)" slot="reference" style="padding:0;font-size:11px;font-weight:bold">#{{idx+1}}</el-button>
                                </el-popover>
                                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px;text-align:right">{{item.groupName}}</span>
                            </div>
                            <el-popover placement="left" width="420" trigger="hover" :disabled="!hasPreview(item.path)">
                                <div style="text-align:center">
                                    <img v-if="hasPreview(item.path)" :src="previewSrc(item.path)" loading="lazy" style="max-width:400px;max-height:500px;display:block;margin:0 auto">
                                    <div v-else style="color:#999;padding:20px">暂无预览</div>
                                </div>
                                <img v-if="hasPreview(item.path)" slot="reference" :src="previewSrc(item.path)" :data-filepath="item.path" draggable="true" loading="lazy" @click="updateModel(item.path)" @contextmenu.prevent="exportToMmd(item.path)"
                                    :style="{borderRadius:'6px',width:settings.preview.gridThumbWidth+'px',height:settings.preview.gridThumbHeight+'px',objectFit:'cover',cursor:'pointer'}">
                                <div v-else slot="reference" @click="updateModel(item.path)" :style="{borderRadius:'6px',width:settings.preview.gridThumbWidth+'px',height:settings.preview.gridThumbHeight+'px',background:'#f0f0f0',display:'flex',alignItems:'center',justifyContent:'center',color:'#999',fontSize:'12px',cursor:'pointer'}">无预览</div>
                            </el-popover>
                            <div style="display:flex;align-items:center;gap:2px;margin-top:6px;max-width:100%">
                                <span :style="{fontSize:'12px',lineHeight:'1.2',textAlign:'center',maxWidth:settings.preview.gridThumbWidth+'px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}">{{item.modelName}}</span>
                                <el-button type="text" size="mini" @click.stop="editTag(item.path, item.group)" style="padding:0;font-size:10px;flex-shrink:0">编</el-button>
                            </div>
                            <el-button circle size="mini" @click.stop="vip(item.path)" style="margin-top:6px" :type="isBookmarked(item.path)?'warning':'default'">{{isBookmarked(item.path)?'★':'☆'}}</el-button>
                            <div style="display:flex;flex-direction:column;align-items:center;margin-top:4px;width:100%;gap:4px">
                                <span v-if="item.category" style="font-size:10px;color:#e6a23c;cursor:pointer;text-align:center;word-break:break-all;line-height:1.3" @click.stop="filterByCategory(item.category)">{{_getCategoryPath(item.category)}}</span>
                                <div v-if="item.groupInfo&&item.groupInfo.tags&&item.groupInfo.tags.length" style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center">
                                    <el-tag v-for="t in item.groupInfo.tags" :key="t" size="mini" style="font-size:10px" @click.native.stop="changeTag(t)">{{t}}</el-tag>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- Settings Dialog -->
                <el-dialog title="设置" :visible.sync="settingsDialogVisible" width="800px" append-to-body top="3vh">
                    <el-form label-width="160px" style="width:100%">
                        <!-- ===== 路径和扫描配置 ===== -->
                        <el-divider content-position="left">路径和扫描配置</el-divider>
                        <el-form-item label="数据存储路径">
                            <div style="width:100%">
                                <div v-for="(dp, idx) in settings.dataPaths" :key="idx" style="display:flex;align-items:center;margin-bottom:6px;padding:6px 10px;background:#f5f7fa;border-radius:4px">
                                    <span style="font-size:13px;word-break:break-all;flex:1;min-width:0;margin-right:8px">{{dp.path}}</span>
                                    <el-tag size="mini" type="success" v-for="t in (dp.tags||[])" :key="t" style="margin-right:2px;flex-shrink:0">{{t}}</el-tag>
                                    <span style="font-size:11px;color:#e6a23c;margin-right:4px;white-space:nowrap;flex-shrink:0">{{_getCategoryPath(dp.category||'人物模型')}}</span>
                                    <el-button size="mini" type="text" icon="el-icon-edit" style="flex-shrink:0" @click="editDataPath(idx)"></el-button>
                                    <el-button size="mini" type="text" icon="el-icon-delete" style="color:#f56c6c;flex-shrink:0" @click="removeDataPath(idx)"></el-button>
                                </div>
                                <el-button size="small" type="primary" icon="el-icon-plus" @click="selectDataPath">添加路径</el-button>
                            </div>
                        </el-form-item>
                        <el-dialog :title="dataPathEditingIndex>=0?'编辑数据路径':'添加数据路径'" :visible.sync="dataPathDialogVisible" width="500px" append-to-body :modal-append-to-body="false">
                            <el-form label-width="80px">
                                <el-form-item label="路径">
                                    <el-input v-model="dataPathForm.path" placeholder="选择文件夹路径">
                                        <template slot="append">
                                            <el-button @click="dataPathDialogPickFolder">浏览</el-button>
                                        </template>
                                    </el-input>
                                </el-form-item>
                                <el-form-item label="默认分类">
                                    <el-select v-model="dataPathForm.category" placeholder="选择默认分类" style="width:100%">
                                        <el-option v-for="c in categories" :key="c.name" :label="c.name" :value="c.name"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="默认标签">
                                    <el-input v-model="dataPathForm.tags" placeholder="多个标签用逗号分隔"></el-input>
                                </el-form-item>
                            </el-form>
                            <span slot="footer">
                                <el-button @click="dataPathDialogVisible=false">取消</el-button>
                                <el-button type="primary" @click="confirmDataPath">确认添加</el-button>
                            </span>
                        </el-dialog>
                        <el-form-item label="默认模型">
                            <el-radio-group v-model="settings.preview.defaultModelMode" size="small" style="margin-bottom:8px">
                                <el-radio label="first">第一个模型</el-radio>
                                <el-radio label="random">随机选择</el-radio>
                                <el-radio label="custom">自选模型</el-radio>
                            </el-radio-group>
                            <div v-if="settings.preview.defaultModelMode==='custom'" style="display:flex;align-items:center;margin-top:4px;gap:8px">
                                <span style="font-size:13px;color:#606266">{{settings.defaultModelPath ? settings.defaultModelPath.split('/').pop() : '未选择'}}</span>
                                <el-button size="small" @click="selectDefaultModel">选择模型</el-button>
                                <el-button v-if="settings.defaultModelPath" size="small" @click="settings.defaultModelPath=''">清除</el-button>
                            </div>
                        </el-form-item>
                        <el-form-item label="开发者工具">
                            <el-button @click="toggleDevTools">打开/关闭 DevTools</el-button>
                        </el-form-item>
                        <el-form-item label="扫描新文件">
                            <el-button type="warning" @click="forceRescan">重新扫描新文件</el-button>
                            <span style="margin-left:8px;color:#999;font-size:12px">扫描目录中的新文件并分类导入</span>
                        </el-form-item>
                        <el-form-item label="扫描所有文件">
                            <el-button type="warning" @click="forceRescanAll">重新扫描所有文件</el-button>
                            <span style="margin-left:8px;color:#999;font-size:12px">扫描所有文件，强制按路径默认分类和标签重新设置</span>
                        </el-form-item>
                        <el-form-item label="重生成预览">
                            <el-button type="danger" @click="forceRegeneratePreviews">强制重新生成所有预览</el-button>
                            <span style="margin-left:8px;color:#999;font-size:12px">忽略已有预览图，强制重新渲染所有模型预览</span>
                        </el-form-item>

                        <!-- ===== 渲染和缩略图配置 ===== -->
                        <el-divider content-position="left">渲染和缩略图配置</el-divider>
                        <el-row :gutter="24">
                            <el-col :span="12">
                                <el-form-item label="环境光颜色">
                                    <el-color-picker v-model="settings.preview.ambientColor" @change="applyPreview"></el-color-picker>
                                </el-form-item>
                                <el-form-item label="显示坐标轴">
                                    <el-switch v-model="settings.preview.showAxis" @change="applyPreview"></el-switch>
                                </el-form-item>
                                <el-form-item label="相机FOV">
                                    <el-slider v-model="settings.preview.cameraFov" :min="20" :max="120" @change="applyPreview" style="width:200px"></el-slider>
                                    <span style="margin-left:10px">{{settings.preview.cameraFov}}°</span>
                                </el-form-item>
                                <el-form-item label="模型共存">
                                    <el-switch v-model="settings.preview.coexistEnabled"></el-switch>
                                    <span style="margin-left:8px;color:#999;font-size:12px">开启后不同类别模型可同时加载</span>
                                </el-form-item>
                                <el-form-item v-if="settings.preview.coexistEnabled" label="共存分类">
                                    <el-select v-model="settings.preview.coexistCategories" multiple placeholder="选择可共存的分类" style="width:100%">
                                        <el-option v-for="c in categories" :key="c.name" :label="c.name" :value="c.name"></el-option>
                                    </el-select>
                                    <span style="font-size:11px;color:#999;margin-top:2px;display:block">同分类替换，不同分类共存</span>
                                </el-form-item>
                                <el-form-item label="显示天空盒">
                                    <el-switch v-model="settings.preview.showSkybox" @change="applyPreview"></el-switch>
                                </el-form-item>
                                <el-form-item label="天空盒模式">
                                    <el-radio-group v-model="settings.preview.skyboxMode" @change="applyPreview" size="small">
                                        <el-radio label="color">纯色渐变</el-radio>
                                        <el-radio label="image">图片</el-radio>
                                    </el-radio-group>
                                </el-form-item>
                                <el-form-item v-if="settings.preview.skyboxMode==='image'" label="天空盒路径">
                                    <el-input v-model="settings.preview.skyboxImagePath" size="small" placeholder="图片或文件夹路径">
                                        <template slot="append"><el-button @click="selectSkyboxImage">选择</el-button></template>
                                    </el-input>
                                </el-form-item>
                                <el-form-item label="模型按钮样式">
                                    <el-radio-group v-model="settings.preview.buttonMode" @change="applyPreview">
                                        <el-radio label="hover">悬浮预览</el-radio>
                                        <el-radio label="thumbnail">缩略图</el-radio>
                                    </el-radio-group>
                                </el-form-item>
                                <el-form-item label="表格缩略图">
                                    <span style="margin-right:4px">宽</span>
                                    <el-input-number v-model="settings.preview.thumbnailWidth" :min="24" :max="128" :step="8" size="small"></el-input-number>
                                    <span style="margin:0 4px">×</span>
                                    <span style="margin-right:4px">高</span>
                                    <el-input-number v-model="settings.preview.thumbnailHeight" :min="24" :max="128" :step="8" size="small"></el-input-number>
                                </el-form-item>
                                <el-form-item label="瀑布流缩略图">
                                    <span style="margin-right:4px">宽</span>
                                    <el-input-number v-model="settings.preview.gridThumbWidth" :min="64" :max="256" :step="8" size="small"></el-input-number>

                <!-- Help Dialog -->
                <el-dialog title="说明" :visible.sync="helpDialogVisible" width="700px" append-to-body top="5vh">
                    <div style="padding:10px;line-height:1.8;font-size:14px;color:#303133;max-height:70vh;overflow-y:auto">
                        <h2 style="margin-bottom:16px;">MMDManager 使用说明</h2>

                        <h3>一、软件简介</h3>
                        <p>MMDManager 是一款 MikuMikuDance（MMD）模型/场景/动作/特效资源管理工具。支持拖拽导入、3D 预览、一键导出到 MMD 软件。</p>

                        <h3>二、导入资源</h3>
                        <p>将文件夹或文件<b>直接拖入软件窗口</b>即可导入，支持同时拖入多个文件夹：</p>
                        <ul>
                            <li><b>人物模型</b>：拖入包含 <code>.pmx</code> / <code>.pmd</code> 文件的文件夹</li>
                            <li><b>场景模型</b>：拖入时选择「场景」</li>
                            <li><b>VMD 动作</b>：拖入包含 <code>.vmd</code> 文件的文件夹</li>
                            <li><b>MME 特效</b>：拖入包含 <code>.fx</code> / <code>.x</code> 文件的文件夹</li>
                        </ul>
                        <p>导入后右上角显示进度条，自动生成模型预览图。<b>注意</b>：导入文件夹才能保留贴图，单独拖入模型文件不会复制贴图。</p>
                        <p><b>批量导入</b>：拖入多个文件夹时，弹出列表对话框，可逐个设置导入为模型或场景。</p>

                        <h3>三、加载模型</h3>
                        <p>在「人物模型」或「场景模型」标签中，<b>左键点击「模」按钮或缩略图</b>即可在 3D 预览区加载模型。</p>
                        <ul>
                            <li><b>鼠标左键拖动</b>：旋转视角</li>
                            <li><b>鼠标滚轮</b>：缩放</li>
                            <li><b>鼠标右键拖动</b>：平移</li>
                        </ul>
                        <p>模型加载后会自动生成预览截图，鼠标悬浮「模」按钮可查看大图。若开启了「场景人物共存」，可以同时加载一个场景和一个角色模型。</p>

                        <h3>四、播放动作（VMD）</h3>
                        <p>在「VMD」标签中，<b>左键点击「动」按钮</b>即可播放动作：</p>
                        <ul>
                            <li>若<b>已加载模型</b>：动作直接应用到当前模型</li>
                            <li>若<b>未加载模型</b>：自动加载「设置」中的默认模型，再应用动作</li>
                        </ul>

                        <h3>五、导出到 MMD 软件</h3>
                        <ul>
                            <li><b>右键「模」/ 缩略图</b>：将模型发送到 MMD 软件中打开</li>
                            <li><b>右键「动」</b>：将当前模型 + VMD 动作一起发送到 MMD</li>
                        </ul>
                        <p>需先在设置中配置 MMD 软件路径。使用 Windows Shell 机制，贴图正常加载，同一时间只打开一个 MMD 实例。</p>

                        <h3>六、菜单栏</h3>
                        <ul>
                            <li><b>Models / Scene / VMD / MME 文件夹</b>：在资源管理器中打开对应目录</li>
                            <li><b>软件列表</b>：将 <code>.exe</code> 放入 <code>software/</code> 子文件夹，菜单栏自动识别</li>
                            <li><b>快捷键</b>：Ctrl+Shift+1 模型管理 / Ctrl+Shift+2 工程页面</li>
                        </ul>

                        <h3>七、设置说明</h3>
                        <ul>
                            <li><b>数据存储目录</b>：所有资源的存放位置</li>
                            <li><b>默认模型路径</b>：点击 VMD 时自动加载的默认模型</li>
                            <li><b>MMD 软件路径</b>：右键导出使用的 MMD 可执行文件</li>
                            <li><b>环境光 / 方向光颜色</b>：3D 预览区光照颜色</li>
                            <li><b>显示坐标轴</b>：预览区是否显示坐标轴</li>
                            <li><b>摄像机自动旋转</b>：加载模型后摄像机是否自动环绕</li>
                            <li><b>相机 FOV</b>：视野角度（20-120°）</li>
                            <li><b>场景人物共存</b>：加载场景时不替换已加载的人物模型</li>
                            <li><b>模型按钮样式</b>：悬浮预览（鼠标悬停出图）/ 缩略图（预览图替代"模"字）</li>
                            <li><b>每页显示数量</b>：表格分页，每页显示条数</li>
                            <li><b>开发者工具</b>：打开/关闭 DevTools 控制台</li>
                        </ul>
                        <p>修改后点击「保存配置」生效。</p>

                        <h3>八、收藏与工程</h3>
                        <p>输入 $ 过滤收藏模型，输入 ! 控制 NSFW 显示。</p>
                    </div>
                </el-dialog>
